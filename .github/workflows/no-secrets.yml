name: No secrets

# This repo's whole subject is Sentry auth tokens: the README, the --help text,
# the tests and the e2e suite all talk about them, and contributors will be
# pasting real ones into a shell while developing. That makes it unusually easy
# for one to end up in a commit by reflex.
#
# A leaked Sentry auth token is a rotate-everything event - it can read every
# issue, event, and stack trace in the org, which is production data. So this is
# a hard gate on every PR rather than a lint.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: No Sentry tokens in the diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a token added in an earlier commit of the branch is
          # caught too, not just one in the tip commit.
          fetch-depth: 0

      - name: Scan for real Sentry auth tokens
        run: |
          set -eu

          # Sentry tokens are `sntrys_` (org auth token) or `sntryu_` (user auth
          # token) followed by a long hex/base64 body. The placeholders we DO
          # want to keep (`sntryu_...`, `sntryu_selfhosted`, `sntrys_abc`) are
          # short and non-hex, so requiring >=32 chars of token body separates a
          # real credential from documentation without banning the docs.
          pattern='sntry[us]_[A-Za-z0-9]{32,}'

          if git grep -nIE "$pattern" -- . ':!*.md' > /tmp/hits 2>/dev/null; then
            {
              echo "::error::A string matching a real Sentry auth token was found."
              echo
              cat /tmp/hits
              echo
              echo "If this is a REAL token: revoke it immediately in Sentry"
              echo "(Settings > Account > API > Auth Tokens), then remove it from the"
              echo "branch history - deleting it in a follow-up commit is NOT enough,"
              echo "it stays in the objects."
              echo
              echo "If this is a placeholder for docs, keep it under 32 characters"
              echo "(e.g. 'sntryu_...') so it does not look like a credential."
            } >&2
            exit 1
          fi

          echo "No Sentry tokens found in tracked files."

      - name: Credential files must not be tracked
        run: |
          set -eu
          # sentry-axi reads all of these at runtime, so they are the files most
          # likely to be created during local testing and committed by accident.
          if git ls-files | grep -Ei '(^|/)(\.sentryclirc|sentry\.properties|auth\.json|\.env)$' > /tmp/files; then
            {
              echo "::error::A credential file is tracked in git:"
              cat /tmp/files
              echo
              echo "These are gitignored for a reason. Remove them with:"
              echo "  git rm --cached <file>"
            } >&2
            exit 1
          fi

          echo "No credential files tracked."
